name: mara_dictionary
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  provider: ^6.1.2 # Tlai hian provider kha fel takin ka lo tlar lût e!
  flutter_tts: ^4.1.1 # Voice atana kan hman belh chu le
  share_plus: ^7.2.1 # Share atana kan hman belh chu le
  http: ^1.6.0
  speech_to_text: ^7.4.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21 # android min sdk specified fixing web issue

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/profile.jpeg
    - assets/Hrotlo.jpeg
    - assets/dictionary.json
    - assets/word.db
